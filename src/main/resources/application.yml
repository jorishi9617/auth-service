server:
  port: ${PORT:${SERVER_PORT:8081}}
spring:
  application:
    name: auth-service
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    schemas: auth
    default-schema: auth
security:
  local-test:
    enabled: ${SECURITY_LOCAL_TEST_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS}
management:
  endpoints:
    web:
      exposure:
        include: health,info
