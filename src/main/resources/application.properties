server.port=${PORT:${SERVER_PORT:8085}}
spring.application.name=auth-service
spring.datasource.url=jdbc:${DATABASE_URL:h2:mem:auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS auth}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=auth
spring.flyway.enabled=false
spring.flyway.schemas=auth
spring.flyway.default-schema=auth
security.local-test.enabled=${SECURITY_LOCAL_TEST_ENABLED:false}
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:3000}
management.endpoints.web.exposure.include=health,info
