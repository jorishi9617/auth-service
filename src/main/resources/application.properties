server.port=${PORT:${SERVER_PORT:8081}}
spring.application.name=auth-service
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:video_platform}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.schemas=auth
spring.flyway.default-schema=auth
security.local-test.enabled=${SECURITY_LOCAL_TEST_ENABLED:false}
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.cors.allowed-origins=${FRONTEND_ORIGINS}
management.endpoints.web.exposure.include=health,info
